<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AetherCircle: Two VR Platforms - One Swift Code Base. Watch the Apple Vision Pro and Meta Quest showcases.">
  <meta name="theme-color" content="#080c18">
  <title>AetherCircle — Two VR Platforms, One Swift Code Base</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 75% 18%, rgba(75, 192, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 28% 78%, rgba(157, 104, 255, 0.15), transparent 30rem),
        #060914;
      color: #f7fbff;
    }

    main {
      width: min(100% - 2rem, 984px);
      padding: clamp(2.5rem, 6vw, 5rem) 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 clamp(2rem, 5vw, 3rem);
      font-size: clamp(2.7rem, 9vw, 5.4rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 480px));
      gap: 24px;
      align-items: start;
      justify-content: center;
    }

    figure { min-width: 0; margin: 0; }

    video {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      margin: 0 auto;
      background: #000;
      border: 1px solid rgba(189, 231, 255, 0.28);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.4);
    }

    figcaption {
      margin-top: 0.85rem;
      color: #bde9ff;
      font-size: 1rem;
      font-weight: 500;
    }

    .tagline {
      margin: clamp(2rem, 5vw, 3rem) 0 0;
      font-size: clamp(1.3rem, 3.4vw, 2rem);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.025em;
    }

    .sneak-peek {
      margin: 0.85rem 0 0;
      color: #bde9ff;
      font-size: clamp(1rem, 2.3vw, 1.2rem);
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .videos { grid-template-columns: minmax(0, 480px); gap: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>AetherCircle</h1>
    <section class="videos" aria-label="AetherCircle platform showcase videos">
      <figure>
        <video controls playsinline preload="metadata" aria-label="AetherCircle showcase on Apple Vision Pro">
          <source src="AVP%20AetherCircle%20Showcase%20480.mov">
          Your browser does not support embedded video. <a href="AVP%20AetherCircle%20Showcase%20480.mov">Download the Apple Vision Pro showcase</a>.
        </video>
        <figcaption>Apple Vision Pro</figcaption>
      </figure>
      <figure>
        <video controls playsinline preload="metadata" aria-label="AetherCircle showcase on Meta Quest">
          <source src="Quest%20AetherCircle%20Showcase%20480%20a.mov">
          Your browser does not support embedded video. <a href="Quest%20AetherCircle%20Showcase%20480%20a.mov">Download the Meta Quest showcase</a>.
        </video>
        <figcaption>Meta Quest</figcaption>
      </figure>
    </section>
    <p class="tagline">Two VR Platforms - One Swift Code Base</p>
    <p class="sneak-peek">Sneak Peeked Oct 2026</p>
  </main>
</body>
</html>
