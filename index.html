<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AetherCircle is coming soon.">
  <meta name="theme-color" content="#080c18">
  <title>AetherCircle — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 75% 18%, rgba(75, 192, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 28% 78%, rgba(157, 104, 255, 0.15), transparent 30rem),
        #060914;
      color: #f7fbff;
    }

    main {
      width: min(92vw, 52rem);
      padding: clamp(2rem, 6vw, 4rem) 0;
      text-align: center;
    }

    .artwork {
      display: block;
      width: min(78vw, 31rem);
      height: auto;
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      border: 1px solid rgba(189, 231, 255, 0.28);
      border-radius: clamp(1.25rem, 4vw, 2.25rem);
      box-shadow:
        0 2rem 6rem rgba(0, 0, 0, 0.5),
        0 0 5rem rgba(91, 203, 255, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5.4rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }

    p {
      margin: 1rem 0 0;
      color: #bde9ff;
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img class="artwork" src="aethercircle-1024.jpg" alt="A glowing wand drawing a spiral of stars for AetherCircle">
    <h1>AetherCircle</h1>
    <p>Coming Soon</p>
  </main>
</body>
</html>
